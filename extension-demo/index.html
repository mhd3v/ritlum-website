<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="robots" content="noindex" />
    <link rel="icon" type="image/svg+xml" href="../assets/favicon.svg" />
    <title>Extension demo — Ritlum</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Geist:wght@400..700&display=swap">
    <style>
      :root { --bg: #faf8f4; --bg-alt: #f2efea; --card: #ffffff; --ink: #0a0a0a; --muted: #7a7570; --green: #1c7a44; --green-soft: #e6f4eb; }
      * { box-sizing: border-box; }
      body {
        margin: 0; min-height: 100vh; display: grid; place-items: center; padding: 24px;
        background: var(--bg); color: var(--ink); font: 16px/1.55 "Geist", system-ui, sans-serif;
      }
      main {
        width: 100%; max-width: 440px; padding: 32px; border-radius: 24px;
        background: var(--card); border: 1px solid rgba(0,0,0,.07); box-shadow: 0 1px 3px rgba(0,0,0,.04);
      }
      .eyebrow { margin: 0 0 6px; color: var(--muted); font-size: 13px; font-weight: 500; }
      h1 { margin: 0 0 8px; font-size: 26px; letter-spacing: -.02em; }
      p { margin: 0 0 22px; color: #3a3a3a; }
      button {
        font: inherit; font-weight: 600; border: 0; border-radius: 999px; padding: 12px 22px; cursor: pointer;
        background: var(--ink); color: #fff;
      }
      button:disabled { opacity: .5; cursor: default; }
      #status { margin-top: 18px; min-height: 40px; }
      .done {
        display: inline-block; padding: 8px 14px; border-radius: 999px;
        background: var(--green-soft); color: var(--green); font-weight: 600;
      }
      .pending { color: var(--muted); }
    </style>
  </head>
  <body>
    <main>
      <p class="eyebrow">Ritlum browser extension</p>
      <h1>Practice lesson</h1>
      <p>A sample page for trying the Ritlum extension. Use the button below as the action, and “Lesson complete” as the confirmation message.</p>
      <button id="complete">Mark lesson complete</button>
      <div id="status" aria-live="polite"></div>
    </main>
    <script>
      const button = document.getElementById('complete');
      const status = document.getElementById('status');
      button.addEventListener('click', () => {
        button.disabled = true;
        status.innerHTML = '<span class="pending">Saving…</span>';
        setTimeout(() => {
          status.innerHTML = '<span class="done">Lesson complete</span>';
          button.disabled = false;
        }, 800);
      });
    </script>
  </body>
</html>
